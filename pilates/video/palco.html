<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>RE FORMER — palco per il video</title>
    <style>
      /* Il "palco": un telefono in verticale, una didascalia sotto, i colori
         dello studio attorno. Serve solo a girare il video: l'app sta dentro
         l'iframe e non sa di essere ripresa.

         La misura è quella dei social in verticale (1080×1920), che è anche
         quella che si guarda meglio su WhatsApp. */
      @font-face { font-family: "Fraunces"; src: url("../prototipo/font/Fraunces.woff2") format("woff2"); font-weight: 300 700; }
      @font-face { font-family: "DM Sans"; src: url("../prototipo/font/DMSans.woff2") format("woff2"); font-weight: 300 800; }

      :root {
        --primario: #7b5a59;
        --primario-scuro: #5e4342;
        --crema: #f5e9df;
        --taupe: #bfa091;
        --accento: #a9654b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; width: 1080px; height: 1920px; overflow: hidden; position: relative;
        font-family: "DM Sans", system-ui, sans-serif; color: var(--primario-scuro);
        background: var(--crema);
        display: flex; flex-direction: column; align-items: center;
      }

      .sfondo { position: absolute; inset: 0; pointer-events: none; }
      .sfondo i { position: absolute; border-radius: 50%; }
      .sfondo i:nth-child(1) { width: 1100px; height: 1100px; top: -620px; right: -420px; background: #eee0d6; }
      .sfondo i:nth-child(2) { width: 700px; height: 700px; bottom: -260px; left: -380px; background: #ead8ca; }
      .sfondo i:nth-child(3) { width: 260px; height: 260px; bottom: 380px; right: -110px; background: #efdccf; }

      header { position: relative; display: flex; align-items: center; gap: 22px; padding: 40px 0 22px; }
      header img { height: 70px; }
      header .nome { font-family: "Fraunces", Georgia, serif; font-size: 44px; font-weight: 600; color: var(--primario); line-height: 1; letter-spacing: 0.14em; }
      header .sotto { font-size: 22px; opacity: 0.7; margin-top: 6px; }

      .telefono {
        position: relative; width: 700px; height: 1452px; border-radius: 62px; padding: 12px;
        background: linear-gradient(160deg, #6e5150, #3b2b2a);
        box-shadow: 0 50px 90px rgba(94, 67, 66, 0.3), 0 0 0 2px rgba(255, 255, 255, 0.5);
        flex: 0 0 auto;
      }
      .schermo { width: 676px; height: 1428px; border-radius: 50px; overflow: hidden; background: var(--crema); }
      /* L'app gira alla misura di un telefono vero (414×874) e la si
         ingrandisce: i caratteri restano quelli veri. */
      .schermo iframe { width: 414px; height: 874px; border: 0; transform: scale(1.633); transform-origin: top left; }

      .didascalia { position: relative; width: 960px; min-height: 230px; padding: 30px 0 0; text-align: center; }
      .passo {
        font-size: 22px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
        color: var(--accento); opacity: 0; transition: opacity 0.35s ease;
      }
      .frase {
        margin-top: 14px; font-family: "Fraunces", Georgia, serif; font-size: 50px; font-weight: 600;
        line-height: 1.2; color: var(--primario-scuro);
        opacity: 0; transform: translateY(14px); transition: opacity 0.45s ease, transform 0.45s ease;
      }
      .passo.dentro, .frase.dentro { opacity: 1; transform: none; }

      .tocco {
        position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%;
        border: 5px solid rgba(123, 90, 89, 0.9); background: rgba(123, 90, 89, 0.18);
        pointer-events: none; opacity: 0;
      }
      .tocco.batti { animation: batti 0.75s ease-out; }
      @keyframes batti {
        0% { opacity: 0; transform: scale(0.35); }
        18% { opacity: 1; transform: scale(0.75); }
        100% { opacity: 0; transform: scale(1.55); }
      }

      .finale {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; text-align: center; background: var(--crema); opacity: 0; transition: opacity 0.7s ease; pointer-events: none;
      }
      .finale.dentro { opacity: 1; }
      .finale .marchio { width: 260px; }
      .finale h2 { margin: 0; font-family: "Fraunces", Georgia, serif; font-size: 84px; font-weight: 600; color: var(--primario); letter-spacing: 0.14em; }
      .finale .invito { font-size: 44px; font-weight: 600; color: var(--accento); }
      .insieme { width: 860px; max-width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 48px; margin-top: 30px; box-shadow: 0 0 0 10px #fcf6f1, 0 30px 60px rgba(94, 67, 66, 0.18); }
      .numeri { display: flex; gap: 0; width: 860px; justify-content: space-around; margin-top: 12px; }
      .chi { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .chi b { font-family: "Fraunces", Georgia, serif; font-size: 44px; color: var(--primario); }
      .chi span { font-size: 32px; opacity: 0.75; }
    </style>
  </head>
  <body>
    <div class="sfondo"><i></i><i></i><i></i></div>

    <header>
      <img id="marchio" alt="" />
      <div>
        <div class="nome">RE FORMER</div>
        <div class="sotto">La nuova app per prenotare le lezioni</div>
      </div>
    </header>

    <div class="telefono">
      <div class="schermo"><iframe id="app" title="app"></iframe></div>
    </div>

    <div class="didascalia">
      <div class="passo" id="passo"></div>
      <div class="frase" id="frase"></div>
    </div>

    <div class="tocco" id="tocco"></div>

    <div class="finale" id="finale">
      <img class="marchio" id="marchio-finale" alt="" />
      <h2>RE FORMER</h2>
      <div class="invito">Ti aspettiamo sul reformer</div>
      <img class="insieme" id="insieme" alt="Greta ed Elisa" />
      <div class="numeri">
        <div class="chi"><b>Greta</b><span>379 156 7202</span></div>
        <div class="chi"><b>Elisa</b><span>393 650 6230</span></div>
      </div>
    </div>

    <script>
      // Palco e app stanno sullo stesso server (cartella pilates/), così il
      // palco può leggere dentro l'app. ?app= porta i parametri dell'app.
      const parametri = new URLSearchParams(location.search);
      const BASE = "../prototipo";
      const APP = `${BASE}/${parametri.get("app") || ""}`;
      document.getElementById("app").src = APP;
      for (const id of ["marchio", "marchio-finale"]) {
        document.getElementById(id).src = `${BASE}/immagini/marchio.png`;
      }
      document.getElementById("insieme").src = `${BASE}/immagini/insieme.webp`;
      // --- Quello che chiama il regista (lo script Python) ---
      function didascalia(passo, frase) {
        const p = document.getElementById("passo");
        const f = document.getElementById("frase");
        p.classList.remove("dentro");
        f.classList.remove("dentro");
        setTimeout(() => {
          p.textContent = passo || "";
          f.textContent = frase || "";
          p.classList.add("dentro");
          f.classList.add("dentro");
        }, 220);
      }

      function tocco(x, y) {
        const nodo = document.getElementById("tocco");
        nodo.style.left = `${x}px`;
        nodo.style.top = `${y}px`;
        nodo.classList.remove("batti");
        void nodo.offsetWidth;
        nodo.classList.add("batti");
      }

      function finale() {
        document.getElementById("finale").classList.add("dentro");
      }
    </script>
  </body>
</html>
