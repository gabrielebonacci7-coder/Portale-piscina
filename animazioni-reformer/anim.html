<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#f3f1ee}
.wrap{position:absolute;left:50%;top:50%;width:720px;height:720px;margin:-360px 0 0 -360px;perspective:1800px}
.card{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden}
.back{transform:rotateY(180deg)}
svg{width:100%;height:100%;overflow:visible}
.shadow{position:absolute;left:8%;right:8%;bottom:-6%;height:10%;border-radius:50%;background:radial-gradient(rgba(0,0,0,.28),transparent 70%);filter:blur(8px)}
</style>
<div class="wrap"><div class="shadow" id="sh"></div><div class="card" id="card">
  <div class="face"><svg id="s" viewBox="0 0 475 475"></svg></div>
  <div class="face back"><svg viewBox="0 0 475 475"><rect x="3" y="13" width="469" height="447" rx="86" fill="#3d3d3f"/><rect x="27" y="37" width="421" height="403" rx="50" fill="none" stroke="#ec2227" stroke-width="9"/></svg></div>
</div></div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
const V=new URLSearchParams(location.search).get('v')||'0';
const NS='http://www.w3.org/2000/svg',RED='#ec2227',DK='#3d3d3f',C='234 238.5';
const s=document.getElementById('s');
const el=(p,t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const draw=e=>{const L=e.getTotalLength();e.style.strokeDasharray=L;e.style.strokeDashoffset=L;return e};
// geometria: R destra (asta, occhiello, gamba); la R sinistra è la stessa ruotata di 180° attorno al centro
const P={stem:'M234 100V377',bowl:'M234 112H322A80 80 0 0 1 322 272H234',leg:'M306 272L414 380'};
const df=el(s,'defs');const cp=el(df,'clipPath',{id:'in'});el(cp,'rect',{x:40,y:103,width:400,height:265});
const flood=el(df,'clipPath',{id:'fl'});const fc=el(flood,'circle',{cx:237,cy:236,r:400});
const sq=el(s,'rect',{x:3,y:13,width:469,height:447,rx:86,fill:RED,'clip-path':'url(#fl)'});
const frame=el(s,'rect',{x:27,y:37,width:421,height:403,rx:50,fill:'none',stroke:DK,'stroke-width':9});
const G=el(s,'g',{'clip-path':'url(#in)'});
const mk=(g,rot)=>{const h=el(g,'g',rot?{transform:`rotate(180 ${C.replace(' ',' ')})`}:{});const o={};
  for(const k of ['bowl','leg'])o[k]=el(h,'path',{d:P[k],fill:'none',stroke:DK,'stroke-width':24,'stroke-linecap':'butt','stroke-linejoin':'miter'});o.g=h;return o;};
const stem=el(G,'path',{d:P.stem,fill:'none',stroke:DK,'stroke-width':24});
const right=mk(G,false),left=mk(G,true);
const tl=gsap.timeline({paused:true,defaults:{ease:'expo.out'}});
const allR=[right.bowl,right.leg,left.bowl,left.leg,stem];

if(V==='1'){ // SPECCHIO: si disegna una R, la seconda nasce ruotandola di 180°
  allR.forEach(draw);
  gsap.set(sq,{scale:.7,opacity:0,svgOrigin:C});draw(frame);
  gsap.set(left.g,{rotation:0,svgOrigin:C,opacity:0});left.g.removeAttribute('transform');
  [left.bowl,left.leg].forEach(p=>{p.style.strokeDashoffset=0});
  tl.to(sq,{scale:1,opacity:1,duration:.9},.2).to(frame,{strokeDashoffset:0,duration:1.1,ease:'power2.inOut'},.5)
    .to(stem,{strokeDashoffset:0,duration:.5,ease:'power2.inOut'},1.2).to(right.bowl,{strokeDashoffset:0,duration:.8,ease:'power2.inOut'},1.5).to(right.leg,{strokeDashoffset:0,duration:.4,ease:'power2.out'},2.2)
    .to(left.g,{opacity:.35,duration:.2,ease:'none'},2.7).to(left.g,{rotation:180,svgOrigin:C,duration:1.3,ease:'expo.inOut'},2.8).to(left.g,{opacity:1,duration:.5},3.3)
    .to({},{duration:1.6});
}
if(V==='2'){ // CARRELLO: le due R scorrono come il carrello del reformer e si agganciano
  draw(frame);gsap.set(sq,{y:40,opacity:0,svgOrigin:C});
  gsap.set(right.g,{x:330});gsap.set(left.g,{x:-330});gsap.set(stem,{scaleY:0,svgOrigin:C});
  // la R sinistra va spostata sul suo gruppo ruotato: uso un contenitore
  const lw=el(G,'g');lw.appendChild(left.g);const rw=el(G,'g');rw.appendChild(right.g);gsap.set(right.g,{x:0});gsap.set(left.g,{x:0});
  gsap.set(rw,{x:330});gsap.set(lw,{x:-330});
  tl.to(sq,{y:0,opacity:1,duration:.9},.2).to(frame,{strokeDashoffset:0,duration:1,ease:'power2.inOut'},.5)
    .to(stem,{scaleY:1,duration:.7,ease:'expo.out'},1.3)
    .to(rw,{x:0,duration:1.1,ease:'back.out(1.3)'},1.7).to(lw,{x:0,duration:1.1,ease:'back.out(1.3)'},1.85)
    .to('#card',{scale:.97,duration:.12,ease:'power2.out'},2.75).to('#card',{scale:1,duration:.5,ease:'back.out(3)'},2.87)
    .to({},{duration:1.8});
}
if(V==='3'){ // RESPIRO: il rosso si espande dal centro come un'inspirazione, poi il logo respira
  allR.forEach(draw);draw(frame);gsap.set(fc,{attr:{r:0}});
  tl.to(frame,{strokeDashoffset:0,duration:1.3,ease:'power2.inOut'},.2)
    .to([stem],{strokeDashoffset:0,duration:.6,ease:'power2.inOut'},.9)
    .to([right.bowl,left.bowl],{strokeDashoffset:0,duration:.9,ease:'power2.inOut'},1.2).to([right.leg,left.leg],{strokeDashoffset:0,duration:.45,ease:'power2.out'},1.95)
    .to(fc,{attr:{r:400},duration:1.4,ease:'expo.inOut'},2.2)
    .to('#card',{scale:1.035,duration:1.1,ease:'sine.inOut'},3.6).to('#card',{scale:1,duration:1.2,ease:'sine.inOut'},4.7)
    .to({},{duration:.8});
}
if(V==='4'){ // TESSERA: il logo si gira come una card e mostra il fronte
  gsap.set('#card',{rotationY:-180,y:30});gsap.set('#sh',{opacity:.3,scaleX:.6});
  tl.to('#card',{y:0,duration:.8},.2).to('#card',{rotationY:0,duration:1.7,ease:'expo.inOut'},.6)
    .to('#sh',{opacity:1,scaleX:1,duration:1.7,ease:'expo.inOut'},.6)
    .fromTo([right.g,left.g,stem],{opacity:0},{opacity:1,duration:.01},1.45)
    .fromTo('#card',{rotationX:0},{rotationX:8,duration:.6,ease:'power2.out'},2.3).to('#card',{rotationX:0,duration:1,ease:'back.out(2)'},2.9)
    .to({},{duration:1.6});
}
if(V==='5'){ // DAL CENTRO: tutto parte dal punto centrale, come il "core" nel pilates
  allR.forEach(draw);draw(frame);gsap.set(fc,{attr:{r:0}});
  const dot=el(s,'circle',{cx:234,cy:238.5,r:0,fill:DK});
  stem.setAttribute('d','M234 238.5V100M234 238.5V377');draw(stem);
  tl.to(dot,{attr:{r:16},duration:.5,ease:'back.out(2.5)'},.2).to(dot,{attr:{r:12},duration:.3},.7)
    .to(stem,{strokeDashoffset:0,duration:.8,ease:'expo.inOut'},.9).to(dot,{attr:{r:0},duration:.2},1.1)
    .to([right.bowl,left.bowl],{strokeDashoffset:0,duration:.9,ease:'power3.inOut'},1.5)
    .to([right.leg,left.leg],{strokeDashoffset:0,duration:.35,ease:'power4.out'},2.3)
    .to(fc,{attr:{r:400},duration:1.1,ease:'expo.inOut'},2.5)
    .to(frame,{strokeDashoffset:0,duration:1.1,ease:'power2.inOut'},2.8)
    .to({},{duration:1.6});
}
window.play=()=>{tl.play(0);return tl.duration();};
</script>
