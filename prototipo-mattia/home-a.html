<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&family=Archivo:wdth,wght@125,900&family=Bodoni+Moda:opsz,wght@96,900&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Home 1440x900: cemento grigio-tortora; una grande A trasparente mostra le proiezioni di un progetto sul tavolo */
:root{--light:#ece6dc;--muted:#bdb2a4}
*{box-sizing:border-box}
html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#55504a;color:var(--light);font-family:"Hanken Grotesk",sans-serif}
canvas,#scene{position:absolute;inset:0}
nav{position:absolute;left:64px;right:64px;top:44px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.brand{display:flex;align-items:center;gap:16px;font:400 18px "Hanken Grotesk"}
.brand svg{width:64px;height:30px;fill:none;stroke:var(--light);stroke-width:2.4;stroke-linejoin:round}
.links{display:flex;gap:40px;font:400 15px "Hanken Grotesk";color:var(--muted)}
.copy{position:absolute;right:64px;top:230px;width:380px;z-index:2}
.copy h1{margin:0;font:300 54px/1.04 "Hanken Grotesk";letter-spacing:-.025em}
.copy p{margin:22px 0 0;font-size:18px;line-height:1.5;color:var(--muted)}
.tag{position:absolute;right:64px;width:380px;bottom:56px;font:400 13px "JetBrains Mono";color:var(--muted);z-index:2}
</style>
<canvas id="c" width="1440" height="900"></canvas>
<svg id="scene" viewBox="0 0 1440 900"></svg>
<nav>
  <div class="brand"><svg viewBox="0 0 240 110"><path d="M0 96H48V44L84 16L120 44V96H136V60L160 40L184 60V96H232"/></svg>Mattia Moretti, architetto</div>
  <div class="links"><span>Progetti</span><span>Ambiti</span><span>Formazione</span><span>Contatti</span></div>
</nav>
<div class="copy"><h1>Restauro e progetto di case storiche</h1><p>Dal rilievo al cantiere, con le pratiche incluse. Studio a Marino.</p></div>
<div class="tag" id="tag"></div>

<script>
const V=new URLSearchParams(location.search).get('v')||'1';
// cemento
const c=document.getElementById('c'),x=c.getContext('2d'),W=1440,H=900;
x.fillStyle='#55504a';x.fillRect(0,0,W,H);
for(let i=0;i<320;i++){const r=30+Math.random()*240,px=Math.random()*W,py=Math.random()*H,g=x.createRadialGradient(px,py,0,px,py,r),t=Math.random()<.55;
g.addColorStop(0,t?'rgba(150,138,124,.14)':'rgba(36,33,30,.13)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(px-r,py-r,2*r,2*r);}
const d=x.getImageData(0,0,W,H),p=d.data;for(let i=0;i<p.length;i+=4){const n=(Math.random()-.5)*22;p[i]+=n;p[i+1]+=n;p[i+2]+=n;}x.putImageData(d,0,0);
for(let i=0;i<1400;i++){x.fillStyle=Math.random()<.6?'rgba(28,26,24,.4)':'rgba(205,195,182,.16)';x.beginPath();x.arc(Math.random()*W,Math.random()*H,Math.random()*1.8+.3,0,7);x.fill();}

// ---------- disegni (ognuno in un riquadro 400x300) ----------
const L='#45403a',PAPER='#ebe5d9',MONO='JetBrains Mono';
const lab=t=>`<text x="12" y="290" font-family="${MONO}" font-size="13" fill="${L}" letter-spacing="1.5">${t}</text><line x1="12" y1="294" x2="${12+t.length*9.4}" y2="294" stroke="${L}"/>`;
const hatch=`<pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line y2="6" stroke="${L}" stroke-width="1.1"/></pattern>`;
function prospetto(){let s=`<g stroke="${L}" fill="none" stroke-width="1.3"><rect x="40" y="50" width="320" height="210"/><path d="M30 50H370M34 42H366M30 42V50M370 42V50"/>`;
 for(let i=0;i<32;i++)s+=`<line x1="${44+i*10}" y1="42" x2="${44+i*10}" y2="50" stroke-width=".8"/>`;
 s+=`<path d="M40 130H360M40 196H360"/>`;for(let y=200;y<260;y+=8)s+=`<line x1="40" y1="${y}" x2="360" y2="${y}" stroke-width=".6"/>`;
 [80,140,260,320].forEach(cx=>{s+=`<path d="M${cx-16} 120V82A16 16 0 0 1 ${cx+16} 82V120Z"/><path d="M${cx-16} 186V150H${cx+16}V186Z"/><path d="M${cx-22} 120H${cx+22}"/>`;});
 s+=`<path d="M200-0" /><path d="M176 260V214A24 24 0 0 1 224 214V260" fill="${PAPER}"/><path d="M182 120V82A18 18 0 0 1 218 82V120ZM182 186V150H218V186Z"/></g>`;return s+lab('PROSPETTO');}
function sezione(){let s=`<rect x="20" y="248" width="360" height="22" fill="url(#ht)"/><g stroke="${L}" fill="none" stroke-width="1.3"><line x1="10" y1="248" x2="390" y2="248"/>
 <rect x="50" y="70" width="18" height="178" fill="url(#ht)"/><rect x="332" y="70" width="18" height="178" fill="url(#ht)"/><rect x="190" y="150" width="20" height="98" fill="url(#ht)"/>
 <path d="M68 150A61 50 0 0 1 190 150M210 150A61 50 0 0 1 332 150" stroke-width="1.6"/><path d="M68 142H332" stroke-dasharray="5 4"/>
 <rect x="68" y="134" width="264" height="10" fill="url(#ht)"/><path d="M40 72L200 18L360 72M68 70L200 26L332 70M110 56V70M200 26V70M290 56V70"/></g>
 <g font-family="${MONO}" font-size="11" fill="${L}"><path d="M368 248l-6-8h12Z M368 139l-6-8h12Z" fill="${L}"/><text x="352" y="234">±0.00</text><text x="352" y="125">+4.20</text></g>`;return s+lab('SEZIONE A-A');}
function pianta(){let s=`<path fill="url(#ht)" stroke="${L}" stroke-width="1.5" fill-rule="evenodd" d="M40 40H340V250H40Z M56 56H324V234H56Z"/>
 <rect x="56" y="140" width="268" height="10" fill="url(#ht)" stroke="${L}"/><rect x="186" y="56" width="10" height="178" fill="url(#ht)" stroke="${L}"/>
 <rect x="100" y="138" width="44" height="14" fill="${PAPER}"/><rect x="230" y="246" width="50" height="6" fill="${PAPER}"/>
 <g stroke="${L}" fill="none" stroke-width="1"><path d="M100 150A44 44 0 0 1 144 106M144 150V106"/>
 <g stroke-dasharray="5 4"><path d="M56 56L186 140M186 56L56 140M196 56L324 140M324 56L196 140M56 150L186 234M186 150L56 234M196 150L324 234M324 150L196 234"/></g>
 <path d="M40 22H340M40 16V28M186 16V28M340 16V28M358 40V250M352 40H364M352 250H364"/></g>
 <g font-family="${MONO}" font-size="11" fill="${L}"><text x="100" y="16">6.40</text><text x="250" y="16">6.80</text></g>`;return s+lab('PIANTA PIANO TERRA');}
function assonometria(){const k=Math.cos(Math.PI/6),P=(a,b,z)=>[200+(a-b)*k*60,250+(a+b)*.5*60-z*60].map(n=>n.toFixed(1)).join(' ');
 const ln=(A,B,da)=>`<line x1="${P(...A).split(' ')[0]}" y1="${P(...A).split(' ')[1]}" x2="${P(...B).split(' ')[0]}" y2="${P(...B).split(' ')[1]}" stroke="${L}" stroke-width="1.4" ${da?'stroke-dasharray="5 4"':''}/>`;
 const w=2.4,dd=1.6,h=1.4,r=2.3;let s='';
 [[[0,0,0],[w,0,0]],[[w,0,0],[w,dd,0]],[[0,0,0],[0,dd,0]],[[0,0,0],[0,0,h]],[[w,0,0],[w,0,h]],[[w,dd,0],[w,dd,h]],[[0,dd,0],[0,dd,h]],[[0,0,h],[w,0,h]],[[0,0,h],[0,dd,h]],[[w,0,h],[w,dd/2,r]],[[0,0,h],[0,dd/2,r]],[[0,dd/2,r],[0,dd,h]],[[0,dd/2,r],[w,dd/2,r]],[[w,dd/2,r],[w,dd,h]]].forEach(([a,b])=>s+=ln(a,b));
 s+=ln([0,dd,0],[w,dd,0],1)+ln([0,dd,h],[w,dd,h],1);
 for(let i=0;i<4;i++){const a=.3+i*.5;s+=ln([a,0,.35],[a+.22,0,.35])+ln([a,0,.35],[a,0,.85])+ln([a+.22,0,.35],[a+.22,0,.85])+ln([a,0,.85],[a+.22,0,.85]);}
 return s+lab('ASSONOMETRIA');}
function prospettiva(){const vl=[-120,120],vr=[540,120];let s=`<g stroke="${L}" fill="none" stroke-width="1.2"><line x1="0" y1="120" x2="400" y2="120" stroke-dasharray="2 4"/>`;
 const top=[200,30],bot=[200,270];const t=(p,v,f)=>[p[0]+(v[0]-p[0])*f,p[1]+(v[1]-p[1])*f];
 const A=t(top,vl,.55),B=t(bot,vl,.55),C=t(top,vr,.45),D=t(bot,vr,.45);
 s+=`<path d="M${top}L${A}L${B}L${bot}Z M${top}L${C}L${D}L${bot}Z"/>`;
 for(let f=.12;f<.55;f+=.13){const a=t(top,vl,f),b=t(bot,vl,f);s+=`<line x1="${a[0]}" y1="${a[1]+40}" x2="${b[0]}" y2="${b[1]-40}"/>`;}
 for(let f=.1;f<.45;f+=.11){const a=t(top,vr,f),b=t(bot,vr,f);s+=`<line x1="${a[0]}" y1="${a[1]+40}" x2="${b[0]}" y2="${b[1]-40}"/>`;}
 s+=`<path d="M${top}L${vl}M${bot}L${vl}M${top}L${vr}M${bot}L${vr}" stroke-width=".5" stroke-dasharray="3 5"/></g>`;return s+lab('PROSPETTIVA');}
// Pianta primo piano: scala, finestre, bagno, quote interne
function pianta2(){let s=`<path fill="url(#ht)" stroke="${L}" stroke-width="1.5" fill-rule="evenodd" d="M30 40H370V260H30Z M46 56H354V244H46Z"/>
 <rect x="150" y="56" width="10" height="188" fill="url(#ht)" stroke="${L}"/><rect x="260" y="56" width="8" height="110" fill="url(#ht)" stroke="${L}"/><rect x="160" y="160" width="194" height="8" fill="url(#ht)" stroke="${L}"/>
 <g fill="${PAPER}"><rect x="80" y="36" width="40" height="24"/><rect x="190" y="36" width="44" height="24"/><rect x="296" y="36" width="36" height="24"/><rect x="80" y="240" width="40" height="24"/><rect x="290" y="240" width="40" height="24"/><rect x="146" y="100" width="18" height="36"/><rect x="200" y="156" width="30" height="16"/></g>
 <g stroke="${L}" fill="none" stroke-width="1"><path d="M80 40H120M80 48H120M80 56H120M190 40H234M190 48H234M190 56H234M296 40H332M296 48H332M296 56H332M80 244H120M80 252H120M80 260H120M290 244H330M290 252H330M290 260H330"/>
 <path d="M164 100A36 36 0 0 1 200 136M200 172A30 30 0 0 0 230 202"/>
 <rect x="56" y="150" width="84" height="84"/>${[...Array(9)].map((_,i)=>`<line x1="56" y1="${150+i*9.3}" x2="140" y2="${150+i*9.3}"/>`).join('')}<path d="M98 230V158M92 166L98 158L104 166"/>
 <rect x="282" y="70" width="40" height="22" rx="4"/><circle cx="336" cy="140" r="9"/><rect x="190" y="70" width="56" height="40"/>
 <path d="M30 22H370M30 16V28M150 16V28M260 16V28M370 16V28M388 40V260M382 40H394M382 160H394M382 260H394"/></g>
 <g font-family="${MONO}" font-size="11" fill="${L}"><text x="80" y="14">4.80</text><text x="194" y="14">4.40</text><text x="300" y="14">4.40</text><text x="60" y="100">CAMERA</text><text x="270" y="210">SOGGIORNO</text><text x="276" y="118">BAGNO</text></g>`;return s+lab('PIANTA PRIMO PIANO');}
// Sezione longitudinale B-B: due piani, volte a botte, solaio in legno, tetto a capriate
function sezione2(){let s=`<rect x="10" y="250" width="380" height="22" fill="url(#ht)"/><g stroke="${L}" fill="none" stroke-width="1.3"><line x1="0" y1="250" x2="400" y2="250"/>
 <rect x="30" y="60" width="16" height="190" fill="url(#ht)"/><rect x="354" y="60" width="16" height="190" fill="url(#ht)"/><rect x="190" y="60" width="16" height="190" fill="url(#ht)"/>
 <path d="M46 170A72 38 0 0 1 190 170M206 170A74 38 0 0 1 354 170" stroke-width="1.6"/><rect x="46" y="162" width="308" height="8" fill="url(#ht)"/>
 <path d="M46 100H354M46 106H354"/>${[...Array(20)].map((_,i)=>`<rect x="${52+i*15}" y="100" width="6" height="6" fill="${L}"/>`).join('')}
 <path d="M20 62L200 18L380 62M46 60L200 26L354 60M200 26V60M110 46L140 60M290 46L260 60"/>
 <rect x="80" y="196" width="26" height="40"/><rect x="290" y="196" width="26" height="40"/><rect x="100" y="118" width="22" height="34"/><rect x="278" y="118" width="22" height="34"/>
 <path d="M206 250L240 220H260L290 190H310" stroke-dasharray="4 3"/></g>
 <g font-family="${MONO}" font-size="11" fill="${L}"><path d="M382 250l-6-8h12Z M382 162l-6-8h12Z M382 100l-6-8h12Z" fill="${L}"/><text x="342" y="240" text-anchor="end">±0.00</text><text x="342" y="152" text-anchor="end">+3.80</text><text x="342" y="92" text-anchor="end">+6.90</text></g>`;return s+lab('SEZIONE B-B');}
const DRAW={prospetto,sezione,pianta,assonometria,prospettiva,pianta2,sezione2};
// carta + tavole posizionate
const box=(fn,x0,y0,w,rot=0)=>`<g transform="translate(${x0} ${y0}) rotate(${rot}) scale(${w/400})">${DRAW[fn]()}</g>`;
function paper(){let s=`<rect width="1440" height="900" fill="${PAPER}"/>`;for(let i=0;i<60;i++)s+=`<line x1="${i*24}" y1="0" x2="${i*24}" y2="900" stroke="#ddd5c6" stroke-width=".8"/>`;for(let i=0;i<38;i++)s+=`<line x1="0" y1="${i*24}" x2="1440" y2="${i*24}" stroke="#ddd5c6" stroke-width=".8"/>`;return s;}

let defs=`<defs>${hatch}<filter id="sh"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity=".5"/></filter>`;
let body='';const tag=document.getElementById('tag');
if(V==='1'){ // A larga e pesante: tutte le proiezioni nella lettera
  tag.textContent='Proposta 1 · A larga e piena, cinque proiezioni dentro la lettera';
  defs+=`<clipPath id="w"><text x="570" y="880" text-anchor="middle" font-family="Archivo" font-stretch="125%" font-weight="900" font-size="1080">A</text></clipPath></defs>`;
  body=`<g filter="url(#sh)"><g clip-path="url(#w)">${paper()}${box('assonometria',420,60,300)}${box('prospetto',100,330,400)}${box('sezione',620,330,400)}${box('pianta',40,600,360)}${box('prospettiva',740,600,360)}</g></g>`;
}else if(V==='2'){ // A fatta di tre strisce, ognuna una proiezione con il suo nome
  tag.textContent='Proposta 2 · A fatta di tre strisce, ognuna una proiezione diversa';
  const left='M470 70H600L330 870H180Z',right='M610 70H740L980 870H830Z',bar='M250 560H930V660H250Z';
  defs+=`<clipPath id="l"><path d="${left}"/></clipPath><clipPath id="r"><path d="${right}"/></clipPath><clipPath id="b"><path d="${bar}"/></clipPath></defs>`;
  const strip=(id,content)=>`<g filter="url(#sh)"><g clip-path="url(#${id})">${paper()}${content}</g></g>`;
  body=strip('l',box('prospetto',150,90,480)+box('assonometria',150,480,480))+strip('r',box('sezione',600,120,480)+box('prospettiva',640,500,420))+strip('b',box('pianta',240,520,700,0));
  body+=`<g font-family="${MONO}" font-size="13" fill="#ece6dc" stroke="#ece6dc"><line x1="300" y1="300" x2="380" y2="300" stroke-width="1"/><text x="196" y="304" stroke="none">PROSPETTO</text>
  <line x1="770" y1="300" x2="840" y2="300"/><text x="850" y="304" stroke="none">SEZIONE</text><line x1="930" y1="610" x2="980" y2="610"/><text x="990" y="614" stroke="none">PIANTA</text></g>`;
}else{ // A bastoni a contrasto + linee di costruzione della lettera
  tag.textContent='';
  defs+=`<clipPath id="w"><text x="560" y="870" text-anchor="middle" font-family="Bodoni Moda" font-weight="900" font-size="960">A</text></clipPath></defs>`;
  body=`<g filter="url(#sh)"><g clip-path="url(#w)">${paper()}${box('sezione2',440,128,280)}${box('pianta2',470,330,330)}${box('sezione',560,600,345)}</g></g>
  <g stroke="#ece6dc" stroke-opacity=".45" fill="none" stroke-width="1"><line x1="80" y1="870" x2="1040" y2="870"/><line x1="80" y1="140" x2="1040" y2="140"/><line x1="560" y1="40" x2="560" y2="890" stroke-dasharray="14 5 2 5"/><circle cx="560" cy="505" r="370" stroke-dasharray="2 6"/></g>
  <g font-family="${MONO}" font-size="12" fill="#ece6dc" fill-opacity=".7"><text x="84" y="132">ALTEZZA MAIUSCOLE</text><text x="84" y="888">LINEA DI BASE</text></g>`;
}
document.getElementById('scene').innerHTML=defs+body;
</script>
