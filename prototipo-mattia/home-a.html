<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--concrete:#57524c;--taupe:#8b8075;--light:#ece6dc;--muted:#c2b8aa;--brown:#b98654}
*{box-sizing:border-box}
html,body{margin:0;width:1440px;height:900px;overflow:hidden;font-family:"Instrument Sans",sans-serif;color:var(--light);background:var(--concrete)}
canvas{position:absolute;inset:0}
nav{position:absolute;left:64px;right:64px;top:44px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:16px;font:600 14px/1.3 "Instrument Sans";letter-spacing:.28em;text-transform:uppercase}
.brand span{display:block;font-weight:400;letter-spacing:.2em;font-size:12px;color:var(--muted);text-transform:lowercase}
.brand svg{width:46px;height:46px;fill:none;stroke:var(--light);stroke-width:3.5;stroke-linecap:square}
.links{display:flex;gap:36px;font:500 15px "Instrument Sans";color:var(--muted)}
.links b{color:var(--light);font-weight:500}
.bigA{position:absolute;left:120px;top:90px;width:760px;height:800px}
.side{position:absolute;right:64px;top:300px;width:420px}
.side h1{margin:0;font:500 64px/1 "Instrument Sans";letter-spacing:-.02em}
.side p{margin:22px 0 0;font-size:19px;line-height:1.5;color:var(--muted);max-width:34ch}
.strip{position:absolute;right:64px;bottom:64px;width:420px;display:grid;gap:10px}
.strip div{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid #ffffff2a;font-size:15px}
.strip span{color:var(--muted)}
</style>
<canvas id="c" width="1440" height="900"></canvas>
<nav>
  <div class="brand"><svg viewBox="0 0 120 120"><path d="M8 84H38V54L60 34L82 54V84H112"/></svg><div>Mattia Moretti<span>architetto</span></div></div>
  <div class="links"><b>Progetti</b><span>Studio</span><span>Formazione</span><span>Contatti</span></div>
</nav>

<svg class="bigA" viewBox="0 0 760 800">
  <defs>
    <clipPath id="a"><path fill-rule="evenodd" d="M300 20H460L740 780H580L522 610H238L180 780H20ZM380 230L282 480H478Z"/></clipPath>
    <filter id="sh"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <g filter="url(#sh)">
    <g clip-path="url(#a)">
      <image href="foto.jpg" x="-60" y="-520" width="900" height="1480" preserveAspectRatio="xMidYMid slice" style="filter:saturate(.75) contrast(1.05)"/>
      <rect width="760" height="800" fill="#5a4a3a" opacity=".18"/>
    </g>
  </g>
  <path fill="none" stroke="#ece6dc" stroke-opacity=".55" stroke-width="1.5" fill-rule="evenodd" d="M300 20H460L740 780H580L522 610H238L180 780H20ZM380 230L282 480H478Z"/>
</svg>

<div class="side">
  <h1>Restauro e progetto di case storiche</h1>
  <p>Dal rilievo al cantiere. Studio a Marino, ai Castelli Romani.</p>
</div>
<div class="strip">
  <div>Progettazione <span>01</span></div>
  <div>Restauro e conservazione <span>02</span></div>
  <div>Pratiche e autorizzazioni <span>03</span></div>
</div>

<script>
// Effetto cemento: macchie larghe tortora + grana fine
const c=document.getElementById('c'),x=c.getContext('2d'),W=1440,H=900;
x.fillStyle='#57524c';x.fillRect(0,0,W,H);
for(let i=0;i<260;i++){const r=40+Math.random()*220,px=Math.random()*W,py=Math.random()*H;
  const g=x.createRadialGradient(px,py,0,px,py,r);const t=Math.random()<.55;
  g.addColorStop(0,t?'rgba(139,128,117,.16)':'rgba(40,37,34,.14)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2);}
const d=x.getImageData(0,0,W,H),p=d.data;for(let i=0;i<p.length;i+=4){const n=(Math.random()-.5)*26;p[i]+=n;p[i+1]+=n;p[i+2]+=n;}
x.putImageData(d,0,0);
for(let i=0;i<900;i++){x.fillStyle=Math.random()<.5?'rgba(30,28,26,.35)':'rgba(200,190,178,.18)';const s=Math.random()*2.2+.4;x.beginPath();x.arc(Math.random()*W,Math.random()*H,s,0,7);x.fill();}
</script>
